---
- name: Set facts for Sage installation
  ansible.builtin.set_fact:
    sage_dir: "{{ sage_dest | default(ansible_facts['user_dir'] + '/sage') }}"
    sage_version: "{{ sage_version | default('10.9') }}"

- name: Install Sage build prerequisites
  ansible.builtin.apt:
    name:
      - bc
      - binutils
      - bzip2
      - ca-certificates
      - curl
      - flex
      - g++
      - gcc
      - gfortran
      - libboost-dev
      - libbz2-dev
      - libz-dev
      - m4
      - make
      - patch
      - perl
      - pkg-config
      - python3
      - python3-dev
      - python3-setuptools
      - python3-venv
      - tar
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure Sage destination directory exists
  ansible.builtin.file:
    path: "{{ sage_dir }}"
    state: directory
    mode: '0755'

- name: Check if Sage source is already extracted
  ansible.builtin.stat:
    path: "{{ sage_dir }}/configure"
  register: sage_configure_stat

- name: Download and extract Sage source tarball
  ansible.builtin.unarchive:
    src: >-
      https://github.com/sagemath/sage/releases/download/{{ sage_version
      }}/sage-{{ sage_version }}.tar.gz
    dest: "{{ sage_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
  when: not sage_configure_stat.stat.exists

- name: Check if Sage is configured
  ansible.builtin.stat:
    path: "{{ sage_dir }}/config.status"
  register: sage_config_stat

- name: Configure Sage
  ansible.builtin.command:
    cmd: ./configure
    chdir: "{{ sage_dir }}"
  when:
    - sage_configure | default(true) | bool
    - not sage_config_stat.stat.exists

- name: Check if Sage binary is built
  ansible.builtin.stat:
    path: "{{ sage_dir }}/sage"
  register: sage_bin_stat

- name: Build Sage from source
  ansible.builtin.command:
    cmd: "make -j{{ ansible_facts['processor_vcpus'] | default(2) }}"
    chdir: "{{ sage_dir }}"
  environment:
    MAKEFLAGS: "-j{{ ansible_facts['processor_vcpus'] | default(2) }}"
  when:
    - sage_build | default(false) | bool
    - not sage_bin_stat.stat.exists

- name: Re-check if Sage binary exists
  ansible.builtin.stat:
    path: "{{ sage_dir }}/sage"
  register: sage_bin_recheck

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: '0755'
  when: sage_bin_recheck.stat.exists

- name: Symlink Sage binary to ~/.local/bin
  ansible.builtin.file:
    src: "{{ sage_dir }}/sage"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/sage"
    state: link
    force: true
  when: sage_bin_recheck.stat.exists
