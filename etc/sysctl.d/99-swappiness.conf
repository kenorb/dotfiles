# Prefer reclaiming page cache over swapping out process (anonymous) memory
# (default: 60). Keeps mostly-idle but latency-sensitive processes resident
# under memory pressure, so they keep responding in milliseconds instead of
# stalling on swap-in faults.
# Trade-off: file-backed pages (page cache, mmap'd files) get evicted first
# under severe pressure.
# Apply with: sudo sysctl --system
vm.swappiness=10
